<title>100 kleine Schritte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@400..700&display=swap">
<style>
:root{
  /* Single violet look, same band colour as the app header. */
  --band:#4B30C2;
  --on-band:#FFFFFF;
  --on-band-muted:#D6CFFF;
  --field:#FFFFFF;
  --field-text:#1B1631;
  --placeholder:#6A6483;
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--band);color:var(--on-band);font:16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
::selection{background:var(--on-band);color:var(--band)}
main{width:100%;max-width:380px;display:grid;gap:22px}
.stamp{width:84px;height:84px;color:var(--on-band);transform:rotate(-8deg)}
.stamp text{fill:currentColor;font-family:var(--font-display)}
h1{margin:0;font:800 52px/.9 var(--font-display);letter-spacing:-.04em;text-wrap:balance}
.lede{margin:0;color:var(--on-band-muted);font-size:17px;max-width:32ch}
form{display:grid;gap:12px;margin-top:6px}
label{font:650 17px var(--font-display)}
input{width:100%;height:58px;border-radius:16px;border:0;background:var(--field);color:var(--field-text);font:500 18px var(--font-body);padding:0 18px;caret-color:var(--band)}
input::placeholder{color:var(--placeholder)}
input:focus{outline:none;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
button{height:54px;border:0;border-radius:999px;background:var(--on-band);color:var(--band);font:650 17px var(--font-display);cursor:pointer;margin-top:6px;transition:opacity .15s}
button:disabled{opacity:.7;cursor:progress}
button:focus-visible{outline:3px solid var(--on-band);outline-offset:3px}
.err{margin:0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.14);font-size:15px}
</style>
</head>
<body>
<main>
  <svg class="stamp" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <filter id="ink" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="warp"/><feDisplacementMap in="SourceGraphic" in2="warp" scale="1.3" xChannelSelector="R" yChannelSelector="G"/></filter>
      <path id="arc" d="M11.4,32 a20.6,20.6 0 1,1 41.2,0 a20.6,20.6 0 1,1 -41.2,0"/>
    </defs>
    <g filter="url(#ink)">
      <circle cx="32" cy="32" r="29.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="32" cy="32" r="25.4" fill="none" stroke="currentColor" stroke-width="1"/>
      <text font-size="5.3" font-weight="700" letter-spacing=".85"><textPath href="#arc">KLEINE SCHRITTE · KLEINE SCHRITTE ·</textPath></text>
      <text x="32" y="37.5" text-anchor="middle" font-size="15.5" font-weight="800">100</text>
    </g>
  </svg>
  <h1>100 kleine Schritte</h1>
  <p class="lede">Klickbarer Prototyp. Gib das Passwort ein, um ihn zu öffnen.</p>
  <form id="f" novalidate>
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <p class="err" id="err" role="alert" hidden>Das Passwort stimmt nicht. Versuch es noch einmal.</p>
    <button id="go" type="submit">Öffnen</button>
  </form>
</main>

  const f = document.getElementById('f');
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  const err = document.getElementById('err');
  const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  pw.focus();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pw.value) { pw.focus(); return; }
    go.disabled = true;
    go.textContent = 'Wird geöffnet …';
    err.hidden = true;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
      const html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (x) {
      err.hidden = false;
      go.disabled = false;
      go.textContent = 'Öffnen';
      pw.select();
    }
  });
